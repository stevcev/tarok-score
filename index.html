<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarok Tracker Pro: Realtime Sync</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-table: #1c3d2f;
            --bg-dark: #0f2027;
            --surface-color: #fdfbf7;
            --primary-color: #d32f2f;
            --secondary-color: #1a1a1a;
            --accent-color: #ffd700;
            --text-dark: #212121;
            --text-light: #ffffff;
            --border-radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }

        body {
            background: linear-gradient(135deg, var(--bg-dark), var(--bg-table));
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container { width: 100%; max-width: 800px; position: relative; }

        .hero { text-align: center; margin-bottom: 30px; animation: fadeIn 1s ease-in; }
        .hero svg { filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.5)); margin-bottom: 10px; }
        .hero h1 { font-size: 2.5em; letter-spacing: 2px; text-transform: uppercase; color: var(--accent-color); text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }

        .card-panel {
            background-color: var(--surface-color);
            color: var(--text-dark);
            border-radius: var(--border-radius);
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.1);
        }

        .card-panel::before { content: '♠'; position: absolute; font-size: 40px; opacity: 0.05; top: 10px; left: 15px; pointer-events: none; }
        .card-panel::after { content: '♥'; position: absolute; font-size: 40px; opacity: 0.05; bottom: 10px; right: 15px; color: var(--primary-color); pointer-events: none; }

        h2, h3 { margin-bottom: 15px; color: var(--secondary-color); border-bottom: 2px solid #eee; padding-bottom: 5px;}

        button {
            background-color: var(--secondary-color); color: var(--text-light); border: none;
            padding: 12 -px 18px; border-radius: 8px; cursor: pointer; font-weight: bold;
            transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; margin: 5px;
        }
        button:hover { opacity: 0.9; transform: translateY(-2px); }
        button.primary { background-color: var(--primary-color); }
        button.accent { background-color: var(--accent-color); color: var(--text-dark); }
        button.outline { background: transparent; border: 2px solid var(--secondary-color); color: var(--secondary-color); }

        input, select { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ccc; }

        .hidden { display: none !important; }
        .flex-row { display: flex; gap: 10px; align-items: center; margin-bottom: 15px; flex-wrap: wrap; }
        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; }

        .table-container { overflow-x: auto; background: white; border-radius: 8px; padding: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: center; border-bottom: 1px solid #eee; }
        th { background-color: #f8f9fa; color: var(--secondary-color); font-weight: bold; }
        
        .star-badge { color: #d35400; font-weight: bold; font-size: 0.85em; display: block; }
        .dealer-col { font-weight: bold; color: var(--primary-color); }

        #endgame-status {
            background: #e3f2fd; border: 2px dashed #2196f3; padding: 15px;
            text-align: center; font-weight: bold; color: #0d47a1; margin-top: -10px;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center;
            z-index: 1000; backdrop-filter: blur(4px);
        }
        .modal-content {
            background: var(--surface-color); color: var(--text-dark);
            padding: 30px; border-radius: var(--border-radius); text-align: center; width: 450px;
        }

        #loader { text-align: center; margin: 10px; color: var(--accent-color); font-weight: bold; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <div class="hero">
        <svg viewBox="0 0 120 120" width="80" height="80">
            <g transform="rotate(-15 40 60)"><rect x="20" y="20" width="50" height="75" rx="4" fill="white" stroke="#222" stroke-width="2"/><text x="38" y="65" fill="#1a1a1a" font-size="30">♠</text></g>
            <g transform="rotate(15 80 60)"><rect x="50" y="20" width="50" height="75" rx="4" fill="white" stroke="#222" stroke-width="2"/><text x="68" y="65" fill="#d32f2f" font-size="30">♥</text></g>
        </svg>
        <h1>Tarok Tracker</h1>
    </div>

    <div id="loader" class="hidden">♠ Syncing with Database...</div>

    <div id="home-screen" class="card-panel">
        <div class="grid-2">
            <button class="primary" style="padding: 20px;" onclick="app.handleEnterPointsClick()">📝 Enter Points</button>
            <button style="padding: 20px;" onclick="app.showWatch()">👁️ Watch Score</button>
        </div>
    </div>

    <div id="setup-screen" class="card-panel hidden">
        <h2>Start New Game</h2>
        <label>Starting Dealer:</label>
        <select id="starting-dealer"></select>
        <div class="flex-row">
            <button class="primary" onclick="app.startNewGame()">Start Game</button>
            <button class="outline" onclick="app.showHome()">Cancel</button>
        </div>
    </div>

    <div id="watch-screen" class="card-panel hidden">
        <div class="flex-row" style="justify-content: space-between;">
            <h2>Active Tables</h2>
            <button class="outline" onclick="app.showHome()">Back</button>
        </div>
        <div id="games-list"></div>
    </div>

    <div id="game-screen" class="hidden">
        <div id="game-controls" class="card-panel flex-row" style="justify-content: space-between;">
            <button class="accent" onclick="app.toggleModule('add-round-module')">➕ Add Round</button>
            <button class="outline" onclick="app.earnStarForAll()">⭐ Global Star</button>
            <button class="primary" onclick="app.toggleModule('end-game-module')">🏁 Finish</button>
        </div>

        <div id="add-round-module" class="card-panel hidden" style="border-left: 5px solid var(--accent-color);">
            <h3>Record Score</h3>
            <div id="team-inputs" class="grid-2">
                <div><label>Active Player:</label><select id="team-p1" onchange="app.checkStarAvailability()"></select></div>
                <div><label>Partner:</label><select id="team-p2"></select></div>
                <div style="grid-column: span 2;">
                    <label>Base Points:</label><input type="number" id="team-points" placeholder="Points won/lost">
                    <p id="team-star-notice" style="font-size: 0.8em; color: var(--primary-color); font-weight: bold;"></p>
                </div>
            </div>
            <button class="primary" onclick="app.submitRound()" style="width: 100%; margin-top: 15px;">Submit Round</button>
        </div>

        <div id="end-game-module" class="card-panel hidden" style="border-left: 5px solid var(--primary-color);">
            <h3>Game Options</h3>
            <div style="background: #fff3f3; padding: 10px; border-radius: 8px; margin-bottom: 10px;">
                <label>Set Skis Target (Player):</label>
                <select id="live-skis-player"></select>
                <button class="outline" onclick="app.setLiveSkis()" style="width: 100%;">Commit Target</button>
            </div>
            <button class="primary" onclick="app.endGameManual()" style="width: 100%;">🛑 Force End Game</button>
        </div>

        <div class="card-panel table-container">
            <div class="flex-row" style="justify-content: space-between;">
                <h3 style="border:none; margin:0;">Live Scoreboard</h3>
                <button id="exit-watch-btn" class="outline hidden" onclick="app.showWatch()">Exit Watch</button>
            </div>
            <table>
                <thead><tr id="table-header"></tr></thead>
                <tbody id="table-body"></tbody>
                <tfoot><tr id="table-totals" style="background: #f1f8e9; font-weight: bold;"></tr></tfoot>
            </table>
        </div>

        <div id="endgame-status" class="card-panel">Initializing...</div>
    </div>
</div>

<div id="winner-modal" class="modal-overlay hidden">
    <div class="modal-content" id="winner-box">
        <h1 id="winner-title">Winner!</h1>
        <p id="winner-name" style="font-size: 2.2em; font-weight: bold; margin: 10px 0;"></p>
        <p id="winner-score" style="font-size: 1.2em;"></p>
        <button class="primary" onclick="app.closeModalsAndHome()" style="margin-top: 20px; width: 100%;">Close</button>
    </div>
</div>

<script>
const app = {
    supabaseUrl: 'https://kkgaceamcqqfacygtvtr.supabase.co',
    supabaseKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtrZ2FjZWFtY3FxZmFjeWd0dnRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQzNjE2NjQsImV4cCI6MjA4OTkzNzY2NH0.UpRr5tW1Quxbplz5dZsXFvy06-3pDCuPIIshE21KH3c',
    db: null,
    realtimeChannel: null,

    players: ['Gordana', 'Stefi', 'Dimi', 'Mile'],
    currentGameId: null,
    currentDealerIndex: 0,
    rounds: [],
    stars: { 'Gordana': 0, 'Stefi': 0, 'Dimi': 0, 'Mile': 0 },
    skisTarget: null,
    isReadOnly: false,

    init() {
        this.db = supabase.createClient(this.supabaseUrl, this.supabaseKey);
        this.populateDropdowns();
    },

    populateDropdowns() {
        ['team-p1', 'team-p2', 'starting-dealer', 'live-skis-player'].forEach(id => {
            const el = document.getElementById(id);
            if(el) {
                el.innerHTML = '';
                this.players.forEach(p => el.innerHTML += `<option value="${p}">${p}</option>`);
            }
        });
    },

    // --- REALTIME SYNC ENGINE ---
    async subscribeToGame(gameId) {
        if (this.realtimeChannel) this.db.removeChannel(this.realtimeChannel);

        this.realtimeChannel = this.db.channel(`game-${gameId}`)
            .on('postgres_changes', { event: '*', schema: 'public', table: 'rounds', filter: `game_id=eq.${gameId}` }, (payload) => {
                if (payload.eventType === 'INSERT') {
                    // Prevent duplicate if already added locally
                    if (!this.rounds.find(r => r.id === payload.new.id)) {
                        this.rounds.push(payload.new);
                        this.recalculateAndRender();
                    }
                } else if (payload.eventType === 'DELETE') {
                    this.refreshFullData(gameId);
                }
            })
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'games', filter: `id=eq.${gameId}` }, (payload) => {
                const updatedGame = payload.new;
                this.skisTarget = updatedGame.skis_target;
                this.recalculateAndRender();
                if (updatedGame.status === 'finished') {
                    this.showFinalWinnerPopup(updatedGame.winner);
                }
            })
            .subscribe();
    },

    async refreshFullData(gameId) {
        const { data: gameData } = await this.db.from('games').select('*').eq('id', gameId).single();
        const { data: roundData } = await this.db.from('rounds').select('*').eq('game_id', gameId).order('round_number', { ascending: true });
        
        this.skisTarget = gameData.skis_target;
        this.rounds = roundData || [];
        this.recalculateAndRender();
        if (gameData.status === 'finished') this.showFinalWinnerPopup(gameData.winner);
    },

    setLoading(active) { document.getElementById('loader').classList.toggle('hidden', !active); },
    hideAllScreens() { ['home-screen', 'setup-screen', 'watch-screen', 'game-screen'].forEach(id => document.getElementById(id).classList.add('hidden')); },
    showHome() { this.hideAllScreens(); document.getElementById('home-screen').classList.remove('hidden'); },
    showWatch() { this.hideAllScreens(); document.getElementById('watch-screen').classList.remove('hidden'); this.loadActiveGames(); },
    toggleModule(id) { document.getElementById(id).classList.toggle('hidden'); },
    closeModalsAndHome() { document.querySelectorAll('.modal-overlay').forEach(m => m.classList.add('hidden')); this.showHome(); },

    async handleEnterPointsClick() {
        const { data } = await this.db.from('games').select('id').eq('status', 'active').limit(1);
        if (data && data.length > 0) this.resumeGame(data[0].id, false);
        else { this.hideAllScreens(); document.getElementById('setup-screen').classList.remove('hidden'); }
    },

    async startNewGame() {
        this.setLoading(true);
        this.currentDealerIndex = this.players.indexOf(document.getElementById('starting-dealer').value);
        const { data } = await this.db.from('games').insert([{ status: 'active' }]).select('id').single();
        this.currentGameId = data.id;
        this.rounds = [];
        this.subscribeToGame(data.id);
        this.setupUI(false);
        this.setLoading(false);
    },

    async resumeGame(id, readOnly) {
        this.setLoading(true);
        this.currentGameId = id;
        this.isReadOnly = readOnly;
        await this.refreshFullData(id);
        this.subscribeToGame(id);
        this.setupUI(readOnly);
        this.setLoading(false);
    },

    setupUI(readOnly) {
        this.hideAllScreens();
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('game-controls').classList.toggle('hidden', readOnly);
        document.getElementById('exit-watch-btn').classList.toggle('hidden', !readOnly);
    },

    async submitRound() {
        const p1 = document.getElementById('team-p1').value;
        const p2 = document.getElementById('team-p2').value;
        let pts = parseInt(document.getElementById('team-points').value) || 0;
        
        let starSpender = 'none';
        if (this.stars[p1] > 0) { pts *= 2; starSpender = p1; }

        const roundScores = { 'Gordana': 0, 'Stefi': 0, 'Dimi': 0, 'Mile': 0 };
        roundScores[p1] += pts;
        if (p1 !== p2) roundScores[p2] += pts;

        const roundData = { 
            game_id: this.currentGameId, 
            round_number: this.rounds.length + 1, 
            scores: { type: 'points', dealer: this.players[this.currentDealerIndex], points: roundScores, star_spent_by: starSpender } 
        };
        
        await this.db.from('rounds').insert([roundData]);
        document.getElementById('add-round-module').classList.add('hidden');
    },

    async earnStarForAll() {
        const roundData = { game_id: this.currentGameId, round_number: this.rounds.length + 1, scores: { type: 'global_star', dealer: this.players[this.currentDealerIndex] } };
        await this.db.from('rounds').insert([roundData]);
    },

    async setLiveSkis() {
        const target = document.getElementById('live-skis-player').value;
        await this.db.from('games').update({ skis_target: target }).eq('id', this.currentGameId);
        this.toggleModule('end-game-module');
    },

    recalculateAndRender() {
        this.stars = { 'Gordana': 0, 'Stefi': 0, 'Dimi': 0, 'Mile': 0 };
        const totals = { 'Gordana': 0, 'Stefi': 0, 'Dimi': 0, 'Mile': 0 };
        
        const header = document.getElementById('table-header');
        const body = document.getElementById('table-body');
        body.innerHTML = '';

        this.rounds.forEach(r => {
            if (r.scores.type === 'global_star') {
                this.players.forEach(p => this.stars[p]++);
                body.innerHTML += `<tr><td>${r.round_number}</td><td colspan="5" style="background:#fffde7; font-weight:bold;">🌟 GLOBAL STAR</td></tr>`;
            } else {
                if (r.scores.star_spent_by !== 'none') this.stars[r.scores.star_spent_by]--;
                let row = `<td>${r.round_number}</td><td class="dealer-col">${r.scores.dealer}</td>`;
                this.players.forEach(p => {
                    const pts = r.scores.points[p] || 0;
                    totals[p] += pts;
                    row += `<td>${pts}${r.scores.star_spent_by === p ? '<br><small>⭐</small>' : ''}</td>`;
                });
                body.innerHTML += `<tr>${row}</tr>`;
            }
        });

        // Update Header with Star counts
        header.innerHTML = '<th>#</th><th>Dealer</th>' + this.players.map(p => `<th>${p}<br><span class="star-badge">⭐ ${this.stars[p]}</span></th>`).join('');
        document.getElementById('table-totals').innerHTML = `<td colspan="2">TOTAL</td>` + this.players.map(p => `<td>${totals[p]}</td>`).join('');
        
        // Dealer Logic
        const lastPointsRound = this.rounds.filter(r => r.scores.type !== 'global_star').pop();
        if (lastPointsRound) this.currentDealerIndex = (this.players.indexOf(lastPointsRound.scores.dealer) + 1) % 4;
        
        // Status Update
        const statusBox = document.getElementById('endgame-status');
        if (this.skisTarget) {
            statusBox.innerHTML = `⛷️ Current Goal: SKIS (Game ends on ${this.skisTarget}'s deal)`;
            if (!this.isReadOnly && this.players[this.currentDealerIndex] === this.skisTarget) this.endGameManual();
        } else {
            statusBox.innerHTML = `🎯 Current Goal: Manual Points Pursuit`;
        }
        
        this.currentTotals = totals;
        this.checkStarAvailability();
    },

    async endGameManual() {
        let winner = this.players[0], max = -9999;
        this.players.forEach(p => {
            const final = this.currentTotals[p] - (this.stars[p] > 0 ? (20 * Math.pow(2, this.stars[p] - 1)) : 0);
            if (final > max) { max = final; winner = p; }
        });
        await this.db.from('games').update({ status: 'finished', winner: winner }).eq('id', this.currentGameId);
    },

    showFinalWinnerPopup(winnerName) {
        document.getElementById('winner-name').innerText = winnerName;
        document.getElementById('winner-score').innerText = `Final Score: ${this.currentTotals[winnerName]}`;
        document.getElementById('winner-modal').classList.remove('hidden');
    },

    async loadActiveGames() {
        const { data } = await this.db.from('games').select('*').order('created_at', { ascending: false }).limit(5);
        document.getElementById('games-list').innerHTML = data.map(g => `
            <div style="background:#fff; border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 8px; display:flex; justify-content:space-between; align-items:center;">
                <div><strong>${g.status === 'active' ? '🟢 Active Game' : '🏁 Finished'}</strong><br><small>${new Date(g.created_at).toLocaleTimeString()}</small></div>
                <button class="primary" onclick="app.resumeGame('${g.id}', true)">Watch</button>
            </div>
        `).join('');
    },

    checkStarAvailability() {
        const p1 = document.getElementById('team-p1').value;
        document.getElementById('team-star-notice').innerText = this.stars[p1] > 0 ? `⭐ Automatic Double (Star available)` : "Standard Points";
    }
};
app.init();
</script>
</body>
</html>
