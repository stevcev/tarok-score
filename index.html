<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarok Tracker Pro: Star Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-table: #1c3d2f;
            --bg-dark: #0f2027;
            --surface-color: #fdfbf7;
            --primary-color: #d32f2f;
            --secondary-color: #1a1a1a;
            --accent-color: #ffd700;
            --text-dark: #212121;
            --text-light: #ffffff;
            --border-radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }

        body {
            background: linear-gradient(135deg, var(--bg-dark), var(--bg-table));
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container { width: 100%; max-width: 800px; position: relative; }

        .hero { text-align: center; margin-bottom: 30px; animation: fadeIn 1s ease-in; }
        .hero svg { filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.5)); margin-bottom: 10px; }
        .hero h1 { font-size: 2.5em; letter-spacing: 2px; text-transform: uppercase; color: var(--accent-color); text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }

        .card-panel {
            background-color: var(--surface-color);
            color: var(--text-dark);
            border-radius: var(--border-radius);
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.1);
        }

        .card-panel::before { content: '♠'; position: absolute; font-size: 40px; opacity: 0.05; top: 10px; left: 15px; pointer-events: none; }
        .card-panel::after { content: '♥'; position: absolute; font-size: 40px; opacity: 0.05; bottom: 10px; right: 15px; color: var(--primary-color); pointer-events: none; }

        h2, h3 { margin-bottom: 15px; color: var(--secondary-color); border-bottom: 2px solid #eee; padding-bottom: 5px;}

        button {
            background-color: var(--secondary-color);
            color: var(--text-light);
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 5px;
        }
        button:hover { opacity: 0.9; transform: translateY(-2px); }
        button.primary { background-color: var(--primary-color); }
        button.accent { background-color: var(--accent-color); color: var(--text-dark); }
        button.outline { background: transparent; border: 2px solid var(--secondary-color); color: var(--secondary-color); }

        input, select {
            width: 100%; padding: 12px; margin-bottom: 10px;
            border-radius: 8px; border: 1px solid #ccc;
            background-color: #fff; color: var(--text-dark);
        }

        input[type="checkbox"], input[type="radio"] {
            width: auto;
            margin-right: 5px;
            margin-bottom: 0;
            transform: scale(1.2);
        }

        .hidden { display: none !important; }
        .flex-row { display: flex; gap: 10px; align-items: center; margin-bottom: 15px; flex-wrap: wrap; }
        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; }

        .table-container { overflow-x: auto; background: white; border-radius: 8px; padding: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: center; border-bottom: 1px solid #eee; }
        th { background-color: #f8f9fa; color: var(--secondary-color); }
        
        .star-badge { color: #d35400; font-weight: bold; font-size: 0.9em; display: block; }
        .spent-star-text { font-size: 0.7em; color: #aaa; text-transform: uppercase; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center;
            z-index: 1000; backdrop-filter: blur(4px);
        }
        .modal-content {
            background: var(--surface-color); color: var(--text-dark);
            padding: 30px; border-radius: var(--border-radius); 
            text-align: center; max-width: 90%; width: 450px;
        }

        #loader { text-align: center; margin: 10px; color: var(--accent-color); font-weight: bold; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <div class="hero">
        <svg viewBox="0 0 120 120" width="80" height="80">
            <g transform="rotate(-15 40 60)">
                <rect x="20" y="20" width="50" height="75" rx="4" fill="white" stroke="#222" stroke-width="2"/>
                <text x="38" y="65" fill="#1a1a1a" font-size="30">♠</text>
            </g>
            <g transform="rotate(15 80 60)">
                <rect x="50" y="20" width="50" height="75" rx="4" fill="white" stroke="#222" stroke-width="2"/>
                <text x="68" y="65" fill="#d32f2f" font-size="30">♥</text>
            </g>
        </svg>
        <h1>Tarok Tracker</h1>
    </div>

    <div id="loader" class="hidden">Syncing Deck...</div>

    <div id="home-screen" class="card-panel">
        <div class="grid-2">
            <button class="primary" style="padding: 20px;" onclick="app.handleEnterPointsClick()">📝 Enter Points</button>
            <button style="padding: 20px;" onclick="window.location.href='watching.html'">👁️ Watch Score</button>
        </div>
    </div>

    <div id="setup-screen" class="card-panel hidden">
        <h2>New Game</h2>
        <label>Starting Dealer:</label>
        <select id="starting-dealer"></select>
        <div class="flex-row">
            <button class="primary" onclick="app.startNewGame()">Deal Cards</button>
            <button class="outline" onclick="app.showHome()">Cancel</button>
        </div>
    </div>

    <div id="watch-screen" class="card-panel hidden">
        <div class="flex-row" style="justify-content: space-between;">
            <h2>Game History</h2>
            <button class="outline" onclick="app.showHome()">Back</button>
        </div>
        <div id="games-list"></div>
    </div>

    <div id="game-screen" class="hidden">
        <div id="game-controls" class="card-panel flex-row" style="justify-content: space-between;">
            <button class="accent" onclick="app.toggleModule('add-round-module')">➕ Add Round</button>
            <button class="outline" onclick="app.earnStarForAll()">⭐ Global Star</button>
            <button class="primary" onclick="app.toggleModule('end-game-module')">🏁 Finish</button>
        </div>

        <div id="add-round-module" class="card-panel hidden" style="border-left: 5px solid var(--accent-color);">
            <h3>Add Score</h3>
            <div class="flex-row" style="background: #eee; padding: 10px; border-radius: 8px;">
                <label style="display: flex; align-items: center;"><input type="radio" name="input-mode" value="team" checked onchange="app.toggleInputMode()"> Team</label>
                <label style="display: flex; align-items: center; margin-left: 15px;"><input type="radio" name="input-mode" value="manual" onchange="app.toggleInputMode()"> Manual</label>
            </div>

            <div id="team-inputs" class="grid-2">
                <div><label>Player:</label><select id="team-p1" onchange="app.checkStarAvailability()"></select></div>
                <div><label>Partner:</label><select id="team-p2"></select></div>
                <div style="grid-column: span 2;">
                    <label>Points:</label><input type="number" id="team-points" placeholder="Base points">
                    <p id="team-star-notice" style="font-size: 0.8em; color: var(--primary-color); font-weight: bold;"></p>
                </div>
            </div>

            <div id="manual-inputs" class="hidden">
                <div class="grid-2" id="manual-grid"></div>
                <div style="margin-top: 15px; border-top: 1px solid #ddd; padding-top: 10px;">
                    <label>Spending a Star?</label>
                    <select id="manual-star-spender"><option value="none">-- No one --</option></select>
                </div>
            </div>

            <div style="margin-top: 15px; background: #fffde7; padding: 10px; border-radius: 8px; border: 1px dashed #ffd700;">
                <label style="display: flex; align-items: center; color: #d35400; font-weight: bold; cursor: pointer;">
                    <input type="checkbox" id="grant-global-star"> 🌟 Grant a Star to all players this round
                </label>
            </div>

            <button class="primary" onclick="app.submitRound()" style="width: 100%; margin-top: 15px;">Save Round</button>
            <button class="outline" onclick="app.undoLastRound()" style="width: 100%;">Undo Last</button>
        </div>

        <div id="end-game-module" class="card-panel hidden" style="border-left: 5px solid var(--primary-color);">
            <h3>End Game Options</h3>
            <div style="background: #fff3f3; padding: 10px; border-radius: 8px; margin-bottom: 10px;">
                <label>Set Skis Target:</label>
                <select id="live-skis-player"></select>
                <button class="outline" onclick="app.setLiveSkis()" style="width: 100%;">Set Skis Target</button>
            </div>
            <div style="background: #e3f2fd; padding: 10px; border-radius: 8px; margin-bottom: 10px;">
                <label>Set Point Threshold:</label>
                <input type="number" id="live-point-threshold" placeholder="e.g. 1000">
                <button class="outline" onclick="app.setLiveThreshold()" style="width: 100%;">Set Point Target</button>
            </div>
            <button class="primary" onclick="app.endGameManual()" style="width: 100%;">🛑 Finalize & Penalty Apply</button>
        </div>

        <div class="card-panel table-container">
            <div class="flex-row" style="justify-content: space-between;">
                <h3 style="border:none;">Scoreboard</h3>
                <button id="exit-watch-btn" class="outline hidden" onclick="app.showWatch()">Exit Watch</button>
            </div>
            <table id="score-table">
                <thead><tr id="table-header"></tr></thead>
                <tbody id="table-body"></tbody>
                <<tfoot><tr id="table-totals" style="background: #f1f8e9; font-weight: bold;"></tr></tfoot>
            </table>
        </div>
    </div>
</div>

<div id="active-game-modal" class="modal-overlay hidden">
    <div class="modal-content">
        <h2>Live Game Detected</h2>
        <p>Resume the current session or start a new one?</p>
        <div class="flex-row" style="justify-content: center; margin-top: 20px;">
            <button class="primary" onclick="app.resumeGame(app.pendingActiveGameId, false)">Resume</button>
            <button class="outline" onclick="app.abandonActiveAndStartNew()">Start New</button>
        </div>
    </div>
</div>

<div id="winner-modal" class="modal-overlay hidden">
    <div class="modal-content" id="winner-box">
        <h1 id="winner-title">Winner!</h1>
        <p id="winner-name" style="font-size: 2.2em; font-weight: bold; margin: 10px 0;"></p>
        <div id="penalty-breakdown" style="font-size: 0.85em; margin-bottom: 15px; color: #555; text-align: left; background: #eee; padding: 10px; border-radius: 5px;"></div>
        <p id="winner-score" style="font-size: 1.2em; font-weight: bold;"></p>
        <button class="primary" onclick="app.closeModalsAndHome()" style="margin-top: 20px; width: 100%;">Return Home</button>
    </div>
</div>

<script>
const app = {
    supabaseUrl: 'https://kkgaceamcqqfacygtvtr.supabase.co',
    supabaseKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtrZ2FjZWFtY3FxZmFjeWd0dnRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQzNjE2NjQsImV4cCI6MjA4OTkzNzY2NH0.UpRr5tW1Quxbplz5dZsXFvy06-3pDCuPIIshE21KH3c',
    db: null,

    players: ['Gordana', 'Stefi', 'Dimi', 'Mile'],
    currentGameId: null,
    currentDealerIndex: 0,
    rounds: [],
    stars: { 'Gordana': 0, 'Stefi': 0, 'Dimi': 0, 'Mile': 0 },
    currentTotals: {},
    skisTarget: null,
    pointTarget: null,
    isReadOnly: false,

    init() {
        this.db = supabase.createClient(this.supabaseUrl, this.supabaseKey);
        this.populateDropdowns();
    },

    populateDropdowns() {
        const selects = ['team-p1', 'team-p2', 'starting-dealer', 'live-skis-player', 'manual-star-spender'];
        selects.forEach(id => { const el = document.getElementById(id); if(el) el.innerHTML = (id === 'manual-star-spender') ? '<option value="none">-- No one --</option>' : ''; });
        const manualGrid = document.getElementById('manual-grid');
        manualGrid.innerHTML = '';

        this.players.forEach(p => {
            const opt = `<option value="${p}">${p}</option>`;
            selects.forEach(id => { const el = document.getElementById(id); if(el) el.innerHTML += opt; });
            manualGrid.innerHTML += `<div><label>${p}:</label><input type="number" id="manual-${p}" value="0"></div>`;
        });
        document.getElementById('team-p2').selectedIndex = 1;
    },

    setLoading(active) { document.getElementById('loader').classList.toggle('hidden', !active); },
    hideAllScreens() { ['home-screen', 'setup-screen', 'watch-screen', 'game-screen'].forEach(id => document.getElementById(id).classList.add('hidden')); this.closeModals(); },
    showHome() { this.hideAllScreens(); document.getElementById('home-screen').classList.remove('hidden'); },
    showSetup() { this.hideAllScreens(); document.getElementById('setup-screen').classList.remove('hidden'); },
    closeModals() { document.querySelectorAll('.modal-overlay').forEach(m => m.classList.add('hidden')); },
    closeModalsAndHome() { this.closeModals(); this.showHome(); },
    toggleModule(id) { document.getElementById(id).classList.toggle('hidden'); },
    toggleInputMode() {
        const isTeam = document.querySelector('input[name="input-mode"]:checked').value === 'team';
        document.getElementById('team-inputs').classList.toggle('hidden', !isTeam);
        document.getElementById('manual-inputs').classList.toggle('hidden', isTeam);
    },

    async handleEnterPointsClick() {
        this.setLoading(true);
        const { data } = await this.db.from('games').select('id').eq('status', 'active').limit(1);
        this.setLoading(false);
        if (data && data.length > 0) {
            this.pendingActiveGameId = data[0].id;
            document.getElementById('active-game-modal').classList.remove('hidden');
        } else { this.showSetup(); }
    },

    async abandonActiveAndStartNew() {
        await this.db.from('games').update({ status: 'finished' }).eq('id', this.pendingActiveGameId);
        this.closeModals();
        this.showSetup();
    },

    async startNewGame() {
        this.setLoading(true);
        this.resetState();
        this.currentDealerIndex = this.players.indexOf(document.getElementById('starting-dealer').value);
        try {
            const { data, error } = await this.db.from('games').insert([{ status: 'active' }]).select('id').single();
            if (error) throw error;
            this.currentGameId = data.id;
            this.setupUI(false);
        } catch (e) { alert(e.message); } finally { this.setLoading(false); }
    },

    async resumeGame(id, readOnly) {
        this.setLoading(true);
        this.closeModals();
        this.resetState();
        this.currentGameId = id;
        try {
            const { data: gameData } = await this.db.from('games').select('*').eq('id', id).single();
            if (gameData && gameData.endrule) {
                if (gameData.endrule.type === 'skis') this.skisTarget = gameData.endrule.target;
                if (gameData.endrule.type === 'points') this.pointTarget = gameData.endrule.target;
            }

            const { data: roundData } = await this.db.from('rounds').select('*').eq('game_id', id).order('round_number', { ascending: true });
            this.rounds = roundData || [];
            this.recalculateStateFromRounds();
            this.setupUI(readOnly);
        } catch (e) { alert(e.message); } finally { this.setLoading(false); }
    },

    resetState() { 
        this.rounds = []; 
        this.stars = { 'Gordana': 0, 'Stefi': 0, 'Dimi': 0, 'Mile': 0 }; 
        this.skisTarget = null; 
        this.pointTarget = null;
    },

    recalculateStateFromRounds() {
        this.stars = { 'Gordana': 0, 'Stefi': 0, 'Dimi': 0, 'Mile': 0 };
        this.rounds.forEach(r => {
            if (r.scores.type === 'global_star') {
                this.players.forEach(p => this.stars[p]++);
            } else if (r.scores.type === 'points') {
                if (r.scores.star_spent_by && r.scores.star_spent_by !== 'none') {
                    this.stars[r.scores.star_spent_by]--;
                }
                if (r.scores.granted_global_star) {
                    this.players.forEach(p => this.stars[p]++);
                }
            }
        });
        const pointsRounds = this.rounds.filter(r => r.scores.type !== 'global_star');
        if (pointsRounds.length > 0) {
            this.currentDealerIndex = (this.players.indexOf(pointsRounds[pointsRounds.length - 1].scores.dealer) + 1) % 4;
        }
    },

    setupUI(readOnly) {
        this.isReadOnly = readOnly;
        this.hideAllScreens();
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('game-controls').classList.toggle('hidden', readOnly);
        document.getElementById('exit-watch-btn').classList.toggle('hidden', !readOnly);
        this.renderTable();
        this.checkStarAvailability();
    },

    checkStarAvailability() {
        const p1 = document.getElementById('team-p1').value;
        const hasStar = this.stars[p1] > 0;
        document.getElementById('team-star-notice').innerText = hasStar ? `⭐ Spending 1 star (Available: ${this.stars[p1]}) - Doubling!` : "No stars available.";
    },

    async earnStarForAll() {
        if (!confirm("Add 1 star to everyone?")) return;
        this.setLoading(true);
        const roundData = { game_id: this.currentGameId, round_number: this.rounds.length + 1, scores: { type: 'global_star' } };
        const { data, error } = await this.db.from('rounds').insert([roundData]).select('id').single();
        if (!error) {
            this.rounds.push({ ...roundData, id: data.id });
            this.players.forEach(p => this.stars[p]++);
            this.renderTable();
        }
        this.setLoading(false);
    },

    async submitRound() {
        this.setLoading(true);
        const isTeam = document.querySelector('input[name="input-mode"]:checked').value === 'team';
        const grantStar = document.getElementById('grant-global-star').checked;
        let roundScores = { 'Gordana': 0, 'Stefi': 0, 'Dimi': 0, 'Mile': 0 };
        let starSpender = 'none';

        if (isTeam) {
            const p1 = document.getElementById('team-p1').value;
            const p2 = document.getElementById('team-p2').value;
            let pts = parseInt(document.getElementById('team-points').value) || 0;
            if (this.stars[p1] > 0) { pts *= 2; starSpender = p1; }
            roundScores[p1] += pts;
            if (p1 !== p2) roundScores[p2] += pts;
        } else {
            starSpender = document.getElementById('manual-star-spender').value;
            const mult = (starSpender !== 'none' && this.stars[starSpender] > 0) ? 2 : 1;
            this.players.forEach(p => roundScores[p] = (parseInt(document.getElementById(`manual-${p}`).value) || 0) * mult);
        }

        const roundData = { 
            game_id: this.currentGameId, 
            round_number: this.rounds.length + 1, 
            scores: { 
                type: 'points', 
                dealer: this.players[this.currentDealerIndex], 
                points: roundScores, 
                star_spent_by: starSpender,
                granted_global_star: grantStar
            } 
        };

        const { data, error } = await this.db.from('rounds').insert([roundData]).select('id').single();
        
        if (!error) {
            this.rounds.push({ ...roundData, id: data.id });
            
            if (starSpender !== 'none') this.stars[starSpender]--;
            if (grantStar) this.players.forEach(p => this.stars[p]++);
            
            this.currentDealerIndex = (this.currentDealerIndex + 1) % 4;
            
            document.getElementById('grant-global-star').checked = false; // Reset checkbox
            if (isTeam) document.getElementById('team-points').value = ''; // Reset input
            
            this.renderTable();
            this.toggleModule('add-round-module');
            this.checkEndConditions();
        }
        this.setLoading(false);
    },

    async undoLastRound() {
        if (this.rounds.length === 0) return;
        this.setLoading(true);
        const last = this.rounds.pop();
        await this.db.from('rounds').delete().eq('id', last.id);
        this.recalculateStateFromRounds();
        this.renderTable();
        this.setLoading(false);
    },

    renderTable() {
        const header = document.getElementById('table-header');
        header.innerHTML = '<th>#</th><th>Dealer</th>' + this.players.map(p => `<th>${p}<br><span class="star-badge">⭐ ${this.stars[p]}</span></th>`).join('');
        const body = document.getElementById('table-body');
        body.innerHTML = '';
        const totals = { 'Gordana': 0, 'Stefi': 0, 'Dimi': 0, 'Mile': 0 };

        let displayRoundNum = 1;

        this.rounds.forEach(r => {
            const tr = document.createElement('tr');
            if (r.scores.type === 'global_star') {
                tr.innerHTML = `<td>-</td><td colspan="5" style="background:#fffde7; font-size: 0.8em;">🌟 Global Star Granted</td>`;
            } else {
                let badge = r.scores.granted_global_star ? '<br><span style="font-size:0.8em">🌟</span>' : '';
                let html = `<td>${displayRoundNum++}${badge}</td><td style="color:var(--primary-color);font-weight:bold">${r.scores.dealer}</td>`;
                this.players.forEach(p => {
                    const pts = r.scores.points[p] || 0; totals[p] += pts;
                    const spnt = (r.scores.star_spent_by === p) ? '<br><span class="spent-star-text">Used ⭐</span>' : '';
                    html += `<td>${pts}${spnt}</td>`;
                });
                tr.innerHTML = html;
            }
            body.appendChild(tr);
        });
        
        if (!this.isReadOnly) body.innerHTML += `<tr><td>Next</td><td style="color:var(--primary-color)">👉 ${this.players[this.currentDealerIndex]}</td><td colspan="4"></td></tr>`;
        document.getElementById('table-totals').innerHTML = `<td colspan="2">TOTAL</td>` + this.players.map(p => `<td>${totals[p]}</td>`).join('');
        this.currentTotals = totals;
    },

    async setLiveSkis() { 
        this.skisTarget = document.getElementById('live-skis-player').value; 
        this.pointTarget = null;
        alert(`Target Set: Game ends when ${this.skisTarget} deals.`); 
        await this.db.from('games').update({ endrule: { type: 'skis', target: this.skisTarget } }).eq('id', this.currentGameId);
        this.checkEndConditions(); 
    },

    async setLiveThreshold() {
        const val = parseInt(document.getElementById('live-point-threshold').value);
        if (!val) return;
        this.pointTarget = val;
        this.skisTarget = null;
        alert(`Target Set: Game ends when a player hits ${this.pointTarget} points.`);
        await this.db.from('games').update({ endrule: { type: 'points', target: this.pointTarget } }).eq('id', this.currentGameId);
        this.checkEndConditions();
    },

    checkEndConditions() { 
        if (this.skisTarget && this.rounds.length > 0 && this.players[this.currentDealerIndex] === this.skisTarget) { 
            this.endGameManual(); 
        } 
        if (this.pointTarget) {
            const maxScore = Math.max(...Object.values(this.currentTotals));
            if (maxScore >= this.pointTarget) {
                this.endGameManual();
            }
        }
    },

    async endGameManual() {
        this.setLoading(true);
        let winner = this.players[0], max = -9999, breakHtml = '<strong>Penalties:</strong><br>';
        this.players.forEach(p => {
            const count = this.stars[p];
            const penalty = count > 0 ? (20 * Math.pow(2, count - 1)) : 0;
            const final = this.currentTotals[p] - penalty;
            breakHtml += `${p}: -${penalty} pts (${count} stars left)<br>`;
            if (final > max) { max = final; winner = p; }
        });
        await this.db.from('games').update({ status: 'finished', winner: winner }).eq('id', this.currentGameId);
        document.getElementById('winner-name').innerText = winner;
        document.getElementById('winner-score').innerText = `Final Score: ${max}`;
        document.getElementById('penalty-breakdown').innerHTML = breakHtml;
        const box = document.getElementById('winner-box');
        if (winner === 'Dimi' || winner === 'Mile') { box.style.border = '5px solid var(--accent-color)'; document.getElementById('winner-title').innerText = '🏆 BEST PRO PLAYER 🏆'; }
        document.getElementById('winner-modal').classList.remove('hidden');
        this.setLoading(false);
    },

    async showWatch() {
        this.setLoading(true); this.hideAllScreens(); document.getElementById('watch-screen').classList.remove('hidden');
        const { data } = await this.db.from('games').select('*').order('created_at', { ascending: false }).limit(10);
        document.getElementById('games-list').innerHTML = data.map(g => `
            <div class="game-list-item" style="background:#fff; border: 1px solid #ddd; padding: 10px; margin-bottom: 5px; border-radius: 8px; display:flex; justify-content:space-between;">
                <div><span style="font-size:0.7em;">${new Date(g.created_at).toLocaleDateString()}</span><br><strong>${g.status === 'active' ? '🔴 Live' : g.winner}</strong></div>
                <button class="outline" onclick="app.resumeGame('${g.id}', true)">View</button>
            </div>
        `).join('');
        this.setLoading(false);
    }
};
app.init();
</script>
</body>
</html>
